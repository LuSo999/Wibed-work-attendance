<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit testy</title>
  <script type="importmap">
    { "imports": { "node:test": "./node-shim.js", "node:assert/strict": "./node-shim.js" } }
  </script>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; }
    .ok { color: #15803d; } .fail { color: #b91c1c; }
    pre { background: #f4f4f5; padding: .5rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Unit testy <code>js/calc.js</code> a <code>js/plan.js</code></h1>
  <p id="summary">Běží…</p>
  <ul id="results"></ul>
  <script type="module">
    import { runAll } from './node-shim.js';
    await import('./calc.test.js');
    await import('./plan.test.js');
    const list = document.getElementById('results');
    const { passed, failed } = await runAll(({ name, ok, err }) => {
      const li = document.createElement('li');
      li.className = ok ? 'ok' : 'fail';
      li.textContent = `${ok ? '✔' : '✘'} ${name}`;
      if (err) {
        const pre = document.createElement('pre');
        pre.textContent = err.stack || String(err);
        li.append(pre);
      }
      list.append(li);
    });
    const summary = document.getElementById('summary');
    summary.textContent = `Úspěšné: ${passed}, neúspěšné: ${failed}`;
    summary.className = failed ? 'fail' : 'ok';
  </script>
</body>
</html>
