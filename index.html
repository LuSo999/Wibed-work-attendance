<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Docházka</title>
  <meta name="description" content="Evidence pracovní docházky a banky přesčasů." data-i18n-attr="content:app.description">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Docházka">

  <!-- Téma nastavit ještě před vykreslením, aby stránka neblikla. -->
  <script>
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] } } },
    };
  </script>
  <style>
    :root { color-scheme: light; }
    .dark { color-scheme: dark; }
    [hidden] { display: none !important; }
    body { -webkit-tap-highlight-color: transparent; }
    .tabular { font-variant-numeric: tabular-nums; }
    dialog::backdrop { background: rgb(15 23 42 / .55); backdrop-filter: blur(2px); }
    /* Spodní list na mobilu, modální okno od šířky 768 px */
    dialog.sheet { max-height: 90vh; overflow-y: auto; scroll-padding-top: 7rem; scroll-padding-bottom: 5rem; }
    /* Kompaktní pohledy (?view=compact | ?view=quick, např. ze zkratky na ploše) */
    body.view-compact [data-hide-compact], body.view-quick [data-hide-quick] { display: none !important; }
    body.view-compact main, body.view-quick main { max-width: 360px; padding-bottom: 1.5rem; }
    body.view-compact #tab-overview { gap: .75rem; }
    body.view-compact #tab-overview > * + * { margin-top: .75rem; }
    body.view-compact #bank-balance { font-size: 1.875rem; line-height: 2.25rem; }
    #view-exit { display: none; }
    body.view-compact #view-exit, body.view-quick #view-exit { display: block; }
    @media (max-width: 767px) {
      dialog.sheet { margin: auto 0 0; max-width: 100%; width: 100%; border-bottom-left-radius: 0; border-bottom-right-radius: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px); }
    }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + .5rem); }
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    .dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    /* Nápis „Docházka“ se srdíčkem místo „o“ */
    .wordmark { font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
    .wordmark-heart { display: inline-block; width: .62em; height: .62em; margin: 0 .03em; vertical-align: -.02em; color: #f43f5e; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">

  <!-- ===== Načítání ===== -->
  <section id="screen-loading" class="flex min-h-screen items-center justify-center">
    <div class="flex flex-col items-center gap-3 text-slate-500 dark:text-slate-400">
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-indigo-200 border-t-indigo-600"></div>
      <p data-i18n="common.loading"></p>
    </div>
  </section>

  <!-- ===== Chybějící konfigurace ===== -->
  <section id="screen-setup" class="mx-auto max-w-xl px-4 py-10" hidden>
    <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
      <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-amber-100 text-2xl dark:bg-amber-900/40">⚙️</div>
      <h1 class="text-xl font-bold" data-i18n="setup.title"></h1>
      <p class="mt-2 text-slate-600 dark:text-slate-400">
        <span data-i18n="setup.intro"></span>
        <code class="rounded bg-slate-100 px-1.5 py-0.5 text-sm dark:bg-slate-800">js/firebase-config.js</code>.
      </p>
      <ol class="mt-4 list-decimal space-y-2 pl-5 text-sm text-slate-700 dark:text-slate-300">
        <li><span data-i18n="setup.step1"></span> <a class="text-indigo-600 underline dark:text-indigo-400" href="https://console.firebase.google.com/" target="_blank" rel="noopener">Firebase Console</a></li>
        <li><b>⚙ Project settings → General → Your apps</b> – <span data-i18n="setup.step2"></span></li>
        <li><b>SDK setup and configuration</b> → <b>Config</b>: <span data-i18n="setup.step3"></span></li>
        <li><code>YOUR_…</code> → <code>js/firebase-config.js</code>: <span data-i18n="setup.step4"></span></li>
      </ol>
      <p class="mt-4 text-sm text-slate-500 dark:text-slate-400"><span data-i18n="setup.readme"></span> <a data-readme-link class="text-indigo-600 underline dark:text-indigo-400" target="_blank" rel="noopener">README</a></p>
      <p id="setup-detail" class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300" hidden></p>
    </div>
  </section>

  <!-- ===== Přihlášení ===== -->
  <section id="screen-auth" class="flex min-h-screen items-center justify-center px-4 py-10" hidden>
    <div class="w-full max-w-sm">
      <div class="mb-6 text-center">
        <h1 class="wordmark text-5xl" data-i18n-attr="aria-label:brand.name"><span data-i18n="brand.before" aria-hidden="true"></span><svg class="wordmark-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span data-i18n="brand.after" aria-hidden="true"></span></h1>
        <p class="text-slate-500 dark:text-slate-400" data-i18n="auth.tagline"></p>
        <div class="mt-3 inline-flex rounded-full bg-white p-1 text-sm shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800" role="group" data-i18n-attr="aria-label:lang.label">
          <button type="button" data-set-lang="cs" class="lang-btn rounded-full px-3 py-1 font-medium" data-i18n="lang.cs"></button>
          <button type="button" data-set-lang="en" class="lang-btn rounded-full px-3 py-1 font-medium" data-i18n="lang.en"></button>
        </div>
      </div>
      <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
        <button id="btn-google" type="button" class="flex w-full items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white px-4 py-3 font-medium hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700">
          <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
          <span data-i18n="auth.google"></span>
        </button>
        <div class="my-5 flex items-center gap-3 text-xs uppercase text-slate-400"><span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span><span data-i18n="auth.orEmail"></span><span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span></div>
        <form id="form-auth" class="space-y-3" novalidate>
          <label class="block">
            <span class="text-sm font-medium" data-i18n="auth.email"></span>
            <input name="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800">
          </label>
          <label class="block">
            <span class="text-sm font-medium" data-i18n="auth.password"></span>
            <input name="password" type="password" autocomplete="current-password" required minlength="6" class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800">
          </label>
          <p id="auth-error" class="text-sm text-red-600 dark:text-red-400" hidden></p>
          <p id="auth-info" class="text-sm text-emerald-600 dark:text-emerald-400" hidden></p>
          <button id="btn-auth-submit" type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700 disabled:opacity-60"></button>
        </form>
        <div class="mt-4 flex justify-between text-sm">
          <button id="btn-auth-toggle" type="button" class="text-indigo-600 hover:underline dark:text-indigo-400"></button>
          <button id="btn-auth-reset" type="button" class="text-slate-500 hover:underline dark:text-slate-400" data-i18n="auth.forgot"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Aplikace ===== -->
  <section id="screen-app" hidden>
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/85 backdrop-blur dark:border-slate-800 dark:bg-slate-900/85" style="padding-top: env(safe-area-inset-top, 0px)">
      <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3">
        <span class="wordmark text-xl sm:text-2xl" role="img" data-i18n-attr="aria-label:brand.name"><span data-i18n="brand.before"></span><svg class="wordmark-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span data-i18n="brand.after"></span></span>
        <nav class="ml-4 hidden gap-1 md:flex" data-i18n-attr="aria-label:nav.label" data-hide-compact data-hide-quick>
          <button data-tab="overview" class="tab-btn rounded-lg px-3 py-1.5 text-sm font-medium" data-i18n="nav.overview"></button>
          <button data-tab="month" class="tab-btn rounded-lg px-3 py-1.5 text-sm font-medium" data-i18n="nav.month"></button>
          <button data-tab="plan" class="tab-btn rounded-lg px-3 py-1.5 text-sm font-medium" data-i18n="nav.plan"></button>
          <button data-tab="bank" class="tab-btn rounded-lg px-3 py-1.5 text-sm font-medium" data-i18n="nav.bank"></button>
        </nav>
        <div class="ml-auto flex items-center gap-1">
          <span id="sync-status" class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium" role="status" aria-live="polite"><span id="sync-icon" aria-hidden="true"></span><span id="sync-label" class="max-[349px]:sr-only"></span></span>
          <div class="relative">
            <button id="btn-help" type="button" class="flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold text-slate-600 ring-1 ring-slate-300 hover:bg-slate-100 dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-800" aria-haspopup="true" aria-expanded="false" aria-controls="help-menu" data-i18n-attr="title:help.title;aria-label:help.title">?</button>
            <div id="help-menu" class="absolute right-0 z-30 mt-2 w-60 rounded-xl bg-white p-2 shadow-lg ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700" hidden>
              <button id="btn-onboarding" type="button" class="w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700" data-i18n="help.onboarding"></button>
              <a data-readme-link target="_blank" rel="noopener" class="block w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700" data-i18n="menu.help"></a>
            </div>
          </div>
          <button id="btn-lang" type="button" class="rounded-lg px-2 py-1.5 text-xs font-bold uppercase tracking-wide text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"></button>
          <button id="btn-theme" type="button" class="rounded-lg p-2 hover:bg-slate-100 dark:hover:bg-slate-800"></button>
          <div class="relative">
            <button id="btn-user" type="button" class="flex h-9 w-9 items-center justify-center overflow-hidden rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300" aria-haspopup="true"></button>
            <div id="user-menu" class="absolute right-0 mt-2 w-60 rounded-xl bg-white p-2 shadow-lg ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700" hidden>
              <p id="user-email" class="truncate px-3 py-2 text-sm text-slate-500 dark:text-slate-400"></p>
              <button id="btn-logout" type="button" class="w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700" data-i18n="menu.logout"></button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 pb-28 pt-4 md:pb-10">

      <!-- ---------- Přehled ---------- -->
      <div id="tab-overview" class="space-y-4">
        <div id="overview-week" class="flex flex-wrap items-center gap-2" data-hide-compact data-hide-quick></div>
        <div data-hide-quick class="rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 p-5 text-white shadow-lg shadow-indigo-600/20">
          <p class="text-sm font-medium text-indigo-100" data-i18n="bank.title"></p>
          <p id="bank-balance" class="tabular mt-1 text-4xl font-bold tracking-tight">–</p>
          <div class="mt-3 flex flex-wrap gap-x-6 gap-y-1 text-sm text-indigo-100" data-hide-compact>
            <span><span data-i18n="bank.thisMonth"></span> <b id="bank-month" class="tabular text-white">–</b></span>
            <span><span data-i18n="bank.monthFund"></span> <b id="bank-fund" class="tabular text-white">–</b></span>
          </div>
        </div>

        <div id="today-plan" data-hide-quick class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
          <div class="flex flex-wrap items-center gap-3">
            <div class="min-w-0 flex-1">
              <p id="today-plan-title" class="font-semibold"></p>
              <p id="today-plan-sub" class="text-sm text-slate-500 dark:text-slate-400"></p>
            </div>
            <button id="btn-use-plan" type="button" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700" data-i18n="today.usePlan"></button>
          </div>
          <div id="today-zero" class="mt-3 rounded-xl bg-slate-50 px-3 py-2.5 text-sm dark:bg-slate-800/60" hidden>
            <p class="flex flex-wrap items-center gap-x-2 gap-y-1 font-semibold"><span id="today-zero-title"></span><span id="today-zero-estimate" class="rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-medium text-amber-800 dark:bg-amber-900/60 dark:text-amber-200" hidden></span></p>
            <p id="today-zero-sub" class="text-xs text-slate-500 dark:text-slate-400"></p>
            <p id="today-zero-fixed" class="tabular mt-1 text-xs font-medium" hidden></p>
            <ul id="today-zero-warnings" class="mt-1 space-y-0.5 text-xs text-amber-700 dark:text-amber-400" hidden></ul>
          </div>
          <div id="today-progress" class="mt-3" hidden>
            <div class="flex items-start justify-between gap-2 text-xs text-slate-500 dark:text-slate-400">
              <div class="min-w-0"><p id="today-progress-text" class="tabular"></p><p id="today-progress-break" class="tabular text-[11px] text-slate-400 dark:text-slate-500" hidden></p></div>
              <span id="today-countdown" class="tabular shrink-0 font-medium text-slate-700 dark:text-slate-200"></span>
            </div>
            <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="today-progress-bar"><div id="today-progress-fill" class="h-full rounded-full bg-emerald-500 transition-all" style="width:0"></div></div>
          </div>
          <p id="today-plan-note" class="mt-2 text-sm text-amber-800 dark:text-amber-300" hidden></p>
        </div>

        <div class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
          <p id="entry-other-date" class="mb-3 flex flex-wrap items-center gap-2 rounded-xl bg-amber-50 px-3 py-2 text-sm text-amber-800 dark:bg-amber-950/40 dark:text-amber-300" hidden>
            <span id="entry-other-date-text"></span>
            <button id="btn-entry-today" type="button" class="font-semibold underline" data-i18n="entry.backToToday"></button>
          </p>
          <div id="entry-work">
            <label class="block">
              <span class="text-sm font-medium text-slate-600 dark:text-slate-400" data-i18n="field.time"></span>
              <div class="mt-1 flex gap-2">
                <input id="entry-time" type="time" data-time24 class="tabular w-full rounded-xl border border-slate-300 bg-white px-3 py-3 text-2xl font-semibold dark:border-slate-700 dark:bg-slate-800">
                <button id="btn-now" type="button" class="shrink-0 rounded-xl border border-slate-300 px-4 text-sm font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800" data-i18n="common.now"></button>
              </div>
            </label>
            <div class="mt-4 grid grid-cols-2 gap-3">
              <button id="btn-arrival" type="button" class="flex flex-col items-center rounded-2xl bg-emerald-600 px-4 py-4 font-semibold text-white shadow-sm hover:bg-emerald-700 active:scale-[.98]">
                <span class="text-2xl" aria-hidden="true">→</span><span data-i18n="entry.arrival"></span>
              </button>
              <button id="btn-departure" type="button" class="flex flex-col items-center rounded-2xl bg-rose-600 px-4 py-4 font-semibold text-white shadow-sm hover:bg-rose-700 active:scale-[.98]">
                <span class="text-2xl" aria-hidden="true">←</span><span data-i18n="entry.departure"></span>
              </button>
            </div>
          </div>
          <p id="entry-nonwork-hint" class="text-sm text-slate-600 dark:text-slate-300" hidden></p>
          <p id="entry-error" class="mt-3 text-sm text-red-600 dark:text-red-400" hidden></p>

          <div id="entry-status" data-hide-compact data-hide-quick class="mt-4 grid grid-cols-2 gap-3 border-t border-slate-100 pt-4 text-sm sm:grid-cols-4 dark:border-slate-800"></div>

          <details id="entry-more" data-hide-compact data-hide-quick class="mt-3 border-t border-slate-100 pt-2 dark:border-slate-800">
            <summary class="cursor-pointer select-none py-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400" data-i18n="entry.more"></summary>
            <div class="mt-2 space-y-3">
              <div class="flex flex-wrap items-end gap-3">
                <label class="block min-w-[9rem] flex-1">
                  <span class="text-sm font-medium text-slate-600 dark:text-slate-400" data-i18n="entry.otherDate"></span>
                  <input id="entry-date" type="date" class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-800">
                </label>
                <label class="block min-w-[9rem] flex-1">
                  <span class="text-sm font-medium text-slate-600 dark:text-slate-400" data-i18n="field.dayType"></span>
                  <select id="entry-type" class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-800"></select>
                </label>
              </div>
              <p id="entry-day-info" class="text-sm text-slate-500 dark:text-slate-400"></p>
              <div id="entry-nonwork" hidden>
                <button id="btn-save-type" type="button" class="w-full rounded-2xl bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700 disabled:opacity-50"></button>
              </div>
              <button id="btn-entry-edit" type="button" class="text-sm text-indigo-600 hover:underline dark:text-indigo-400" data-i18n="entry.editDetail"></button>
            </div>
          </details>
        </div>
        <a id="view-exit" href="./" class="text-center text-sm font-medium text-indigo-600 hover:underline dark:text-indigo-400" data-i18n="view.exit"></a>
      </div>

      <!-- ---------- Měsíc ---------- -->
      <div id="tab-month" class="space-y-4" hidden>
        <div class="flex items-center gap-2">
          <button id="btn-month-prev" type="button" class="rounded-xl p-2.5 hover:bg-white dark:hover:bg-slate-900" data-i18n-attr="aria-label:common.prevMonth">
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.8 15.2a1 1 0 0 1-1.4 0l-4.5-4.5a1 1 0 0 1 0-1.4l4.5-4.5a1 1 0 1 1 1.4 1.4L9 10l3.8 3.8a1 1 0 0 1 0 1.4z" clip-rule="evenodd"/></svg>
          </button>

    <form method="dialog" class="p-5">
      <h2 class="text-lg font-bold" data-i18n="holidays.askTitle"></h2>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-300" data-i18n="holidays.askText"></p>
      <div id="holidays-impact" class="mt-3 rounded-xl px-3 py-2 text-sm"></div>
      <div class="mt-5 flex justify-end gap-2">
        <button id="holidays-keep" value="keep" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700" data-i18n="holidays.keep"></button>
        <button id="holidays-off" value="off" class="rounded-xl px-4 py-2.5 text-sm font-medium ring-1 ring-slate-300 hover:bg-slate-100 dark:ring-slate-700 dark:hover:bg-slate-800" data-i18n="holidays.turnOff"></button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex flex-col items-center gap-2 px-4 md:bottom-6" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
